services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hris}
      POSTGRES_USER: ${POSTGRES_USER:-hris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-hris}
      PGDATABASE: ${POSTGRES_DB:-hris}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/migrations/migrate.sh"]
    restart: "no"

  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hris}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hris}?sslmode=disable
      REDIS_ADDRESS: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["worker"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hris}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hris}?sslmode=disable
      REDIS_ADDRESS: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build: .
    entrypoint: ["seed"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hris}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hris}?sslmode=disable
      REDIS_ADDRESS: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]

volumes:
  postgres_data:
  redis_data:
